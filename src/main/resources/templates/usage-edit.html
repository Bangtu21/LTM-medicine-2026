<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa công dụng</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Sửa công dụng</h1>
        <p>Cập nhật thông tin công dụng</p>
    </div>

    <div class="form-box">

        <form action="/usages/edit" method="post">

            <div class="form-group">

                <label>Mã công dụng</label>

                <input type="text"
                       name="id"
                       th:value="${usage.id}"
                       readonly>

            </div>

            <div class="form-group">

                <label>Tên công dụng</label>

                <input type="text"
                       name="name"
                       th:value="${usage.name}"
                       required>

            </div>

            <div class="form-group">

                <label>Mô tả</label>

                <input type="text"
                       name="description"
                       th:value="${usage.description}">

            </div>

            <button class="button" type="submit">
                Cập nhật
            </button>

            <a class="button button-secondary"
               href="/usages">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
