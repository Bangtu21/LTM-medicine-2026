<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm thuốc</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Thêm thuốc</h1>
        <p>Nhập thông tin thuốc mới</p>
    </div>

    <div class="form-box">

        <form action="/medicines/add" method="post">

            <div class="form-group">
                <label>Mã thuốc</label>

                <input type="text"
                       name="id"
                       placeholder="Ví dụ: M01"
                       required>
            </div>

            <div class="form-group">
                <label>Tên thuốc</label>

                <input type="text"
                       name="name"
                       placeholder="Ví dụ: Paracetamol"
                       required>
            </div>

            <div class="form-group">
                <label>Giá</label>

                <input type="number"
                       name="price"
                       step="0.01"
                       placeholder="Ví dụ: 15000"
                       required>
            </div>

            <div class="form-group">
                <label>Dạng thuốc</label>

                <input type="text"
                       name="type"
                       placeholder="Ví dụ: Viên, Siro, Tuýp..."
                       required>
            </div>

            <div class="form-group">

                <label>Công dụng</label>

                <select name="usageId" required>

                    <option value="">
                        -- Chọn công dụng --
                    </option>

                    <option
                            th:each="usage : ${usages}"
                            th:value="${usage.id}"
                            th:text="${usage.name}">
                    </option>

                </select>

            </div>

            <button class="button" type="submit">
                Thêm thuốc
            </button>

            <a class="button button-secondary"
               href="/medicines">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
