<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý thuốc</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Hệ thống quản lý thuốc</h1>
        <p>Quản lý thuốc và công dụng sử dụng giao thức TCP/IP</p>
    </div>

    <div class="card-container">

        <div class="card">

            <h2>💊 Quản lý thuốc</h2>

            <p>
                <a class="button" href="/medicines">
                    Danh sách thuốc
                </a>
            </p>

            <p>
                <a class="button" href="/medicines/add">
                    + Thêm thuốc
                </a>
            </p>

            <p>
                <a class="button" href="/medicines/search-form">
                    🔍 Tìm kiếm thuốc
                </a>
            </p>

        </div>

        <div class="card">

            <h2>📋 Quản lý công dụng</h2>

            <p>
                <a class="button" href="/usages">
                    Danh sách công dụng
                </a>
            </p>

            <p>
                <a class="button" href="/usages/add">
                    + Thêm công dụng
                </a>
            </p>

            <p>
                <a class="button" href="/usages/search-form">
                    🔍 Tìm kiếm công dụng
                </a>
            </p>

        </div>

    </div>

</div>

</body>
</html>
