<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa thuốc</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Sửa thuốc</h1>
        <p>Cập nhật thông tin thuốc</p>
    </div>

    <div class="form-box">

        <form action="/medicines/edit" method="post">

            <div class="form-group">

                <label>Mã thuốc</label>

                <input type="text"
                       name="id"
                       th:value="${medicine.id}"
                       readonly>

            </div>

            <div class="form-group">

                <label>Tên thuốc</label>

                <input type="text"
                       name="name"
                       th:value="${medicine.name}"
                       required>

            </div>

            <div class="form-group">

                <label>Giá thuốc</label>

                <input type="number"
                       name="price"
                       step="0.01"
                       th:value="${medicine.price}"
                       required>

            </div>

            <div class="form-group">

                <label>Dạng thuốc</label>

                <input type="text"
                       name="type"
                       th:value="${medicine.type}"
                       required>

            </div>

            <div class="form-group">

                <label>Công dụng</label>

                <select name="usageId" required>

                    <option
                            th:each="usage : ${usages}"
                            th:value="${usage.id}"
                            th:text="${usage.name}"
                            th:selected="${medicine.usage.id == usage.id}">
                    </option>

                </select>

            </div>

            <button class="button" type="submit">
                Cập nhật
            </button>

            <a class="button button-secondary"
               href="/medicines">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
