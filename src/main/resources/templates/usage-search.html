<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm công dụng</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Tìm kiếm công dụng</h1>
        <p>Tìm công dụng theo tên gần đúng</p>
    </div>

    <div class="form-box">

        <form action="/usages/search" method="get">

            <div class="form-group">

                <label>Tên công dụng</label>

                <input type="text"
                       name="name"
                       placeholder="Ví dụ: đau"
                       required>

            </div>

            <button class="button" type="submit">
                🔍 Tìm kiếm
            </button>

            <a class="button button-secondary"
               href="/usages">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
