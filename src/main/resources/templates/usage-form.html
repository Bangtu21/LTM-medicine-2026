<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm công dụng</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Thêm công dụng</h1>
        <p>Nhập thông tin công dụng mới</p>
    </div>

    <div class="form-box">

        <form action="/usages/add" method="post">

            <div class="form-group">

                <label>Mã công dụng</label>

                <input type="text"
                       name="id"
                       placeholder="Ví dụ: U01"
                       required>

            </div>

            <div class="form-group">

                <label>Tên công dụng</label>

                <input type="text"
                       name="name"
                       placeholder="Ví dụ: Giảm đau"
                       required>

            </div>

            <div class="form-group">

                <label>Mô tả</label>

                <input type="text"
                       name="description"
                       placeholder="Nhập mô tả công dụng">

            </div>

            <button class="button" type="submit">
                Thêm công dụng
            </button>

            <a class="button button-secondary"
               href="/usages">
                Quay lại
            </a>

        </form>

    </div>

</div>

</body>
</html>
